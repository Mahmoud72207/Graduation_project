<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToneAi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>ToneAi</h1>
        <h3>
            Welcome to ToneAi – an intelligent platform that analyzes text sentiment and converts it into expressive speech matching the mood (Positive, Neutral, Negative).
            Discover how words can feel and speak using advanced AI technologies.
        </h3>
    </header>

    <main>
        <section>
            <form method="POST">
                <label for="user-text">Text To Speech:</label><br>
                <textarea id="user-text" name="user-text" rows="6" cols="60" placeholder="Enter your Text..."></textarea><br><br>
                <button type="submit" id="analyzeButton">Analyze Sentiment</button>
                <button type="button" id="speakButton" disabled>Speak Text</button>
            </form>
        </section>

        <section>
            <h2>Result:</h2>
            <div id="result-container">
                <p id="result">{{ result|safe }}</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Graduation_Poject - 2025</p>
    </footer>

    <script>
        const analyzeButton = document.getElementById('analyzeButton');
        const speakButton = document.getElementById('speakButton');
        const textToSpeakInput = document.getElementById('user-text');
        const resultParagraph = document.getElementById('result');
        const synth = window.speechSynthesis;

        analyzeButton.addEventListener('click', function(event) {
            event.preventDefault();
            const text = textToSpeakInput.value;
            fetch('/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `user-text=${encodeURIComponent(text)}`,
            })
            .then(response => response.text())
            .then(data => {
                // بما أن Flask أصبح يرجع النص المباشر (الذي يحتوي على <br>)
                // وليس صفحة HTML كاملة، فإن 'data' هي النتيجة المطلوبة مباشرة.
                if (data) {
                    resultParagraph.innerHTML = data; // نضع الـ data مباشرة في innerHTML
                    speakButton.disabled = false;
                } else {
                    // في حالة عدم وجود بيانات (data فارغة)، أو وجود رسالة خطأ من الخادم
                    resultParagraph.textContent = "Error analyzing sentiment or empty response.";
                    speakButton.disabled = true;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                resultParagraph.textContent = "Error communicating with the server.";
                speakButton.disabled = true;
            });
        });

        speakButton.addEventListener('click', function() {
            // هذا الجزء سينطق النص كما يظهر في فقرة النتيجة، بما في ذلك رموز المشاعر.
            // إذا أردت نطق الجمل فقط بدون الرموز، ستحتاج منطق إضافي لفلترة النص.
            const textToSpeak = resultParagraph.textContent; 

            if (textToSpeak && textToSpeak !== "لم يتم التحليل بعد" && textToSpeak !== "Please enter some text to analyze." && textToSpeak !== "Error analyzing sentiment or empty response." && textToSpeak !== "Error communicating with the server.") {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                synth.speak(utterance);
            } else {
                alert("No valid text to speak or text not yet analyzed.");
            }
        });
    </script>

</body>
</html>
